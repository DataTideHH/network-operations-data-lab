name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile workflow and tests
        run: |
          python -m py_compile \
            scripts/workflow.py \
            scripts/load_sample_data.py \
            scripts/build_sqlite_database.py \
            scripts/run_sqlite_analysis.py \
            scripts/run_data_quality_checks.py \
            tests/test_network_operations_workflow.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate sample summaries
        run: python -m scripts.load_sample_data

      - name: Build SQLite database
        run: python -m scripts.build_sqlite_database --database "${{ runner.temp }}/network_operations.db"

      - name: Run SQLite analysis
        run: python -m scripts.run_sqlite_analysis

      - name: Regenerate public report
        run: python -m scripts.run_data_quality_checks --strict

      - name: Verify committed report is current
        run: git diff --exit-code -- data/processed/data_quality_report.csv
